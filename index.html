<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커리큘럼 대시보드</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar for Tabs */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Smooth transitions */
        body { transition: background-color 0.3s ease, color 0.3s ease; }

        /* Modal Animation */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active {
            opacity: 1; transform: scale(1);
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header Section -->
    <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40 transition-colors border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 pb-4">
            
            <!-- Developer Info -->
            <div class="mb-3">
                <span class="text-xs font-bold text-brand-600 dark:text-brand-400 tracking-wide uppercase bg-brand-50 dark:bg-brand-900/30 px-3 py-1 rounded-full">
                    개발자: 가치있는 미래교육 연구소 대표 김병찬
                </span>
            </div>
            
            <!-- Title & Controls Row -->
            <div class="flex justify-between items-center">
                <!-- Dynamic Title & Logo -->
                <div class="flex items-center space-x-3">
                    <!-- 로고 위치를 타이틀 바로 앞으로 이동 및 크기 확대 -->
                    <img id="brand-logo" src="" class="h-12 sm:h-14 w-auto object-contain hidden" alt="연구소 로고">
                    <h1 id="dashboard-title" class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-gray-900 dark:text-white truncate tracking-tight">
                        <i class="fa-solid fa-circle-notch fa-spin text-brand-500 mr-2"></i>로딩중...
                    </h1>
                </div>
                
                <!-- Controls -->
                <div class="flex items-center space-x-3 ml-4">
                    <button id="theme-toggle" class="p-2 rounded-full bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 transition-colors shadow-sm" title="다크모드/라이트모드 전환">
                        <i class="fa-solid fa-moon text-gray-600 dark:text-gray-300 text-lg hidden dark:block" id="theme-icon-dark"></i>
                        <i class="fa-solid fa-sun text-yellow-500 text-lg block dark:hidden" id="theme-icon-light"></i>
                    </button>
                    
                    <button id="admin-btn" class="flex items-center space-x-2 bg-white border border-gray-300 hover:bg-gray-50 dark:bg-gray-700 dark:border-gray-600 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 px-3 py-2 rounded-lg transition-colors text-sm font-bold shadow-sm">
                        <i class="fa-solid fa-lock text-brand-500"></i>
                        <span class="hidden sm:inline">관리자</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Categories / Tabs -->
        <div class="bg-gray-50/80 dark:bg-gray-800/80 backdrop-blur-md border-t border-gray-200 dark:border-gray-700">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <nav id="tabs-container" class="flex space-x-3 py-4 overflow-x-auto hide-scrollbar">
                    <!-- Tabs will be dynamically inserted here -->
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- Loading State -->
        <div id="loading-state" class="flex flex-col items-center justify-center py-20 hidden">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-brand-500 mb-4"></i>
            <p class="text-gray-600 font-medium dark:text-gray-400">데이터를 실시간으로 동기화 중입니다...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="flex flex-col items-center justify-center py-20 hidden bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm">
            <i class="fa-regular fa-folder-open text-5xl text-gray-400 mb-4"></i>
            <p class="text-gray-500 dark:text-gray-400 text-lg font-medium">해당 카테고리에 데이터가 없습니다.</p>
        </div>

        <!-- Content Grid -->
        <div id="content-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards will be dynamically inserted here -->
        </div>

    </main>

    <!-- Admin Modal -->
    <div id="admin-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-sm p-6 transform transition-all modal-enter border border-gray-200 dark:border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">관리자 모드</h3>
                <button id="close-admin-modal" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-4 font-medium">인증번호를 입력해주세요.</p>
            <input type="password" id="admin-pin-input" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:outline-none mb-4 font-bold text-center tracking-widest text-lg" placeholder="••••">
            <p id="admin-error" class="text-red-500 text-sm hidden mb-4 font-medium"><i class="fa-solid fa-circle-exclamation mr-1"></i>인증번호가 일치하지 않습니다.</p>
            <button id="verify-admin-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md">
                확인 및 접속
            </button>
        </div>
    </div>

    <!-- QR Code Modal -->
    <div id="qr-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-8 transform transition-all modal-enter flex flex-col items-center">
            <div class="w-full flex justify-end mb-2">
                <button id="close-qr-modal" class="text-gray-400 hover:text-gray-700 transition-colors">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>
            <h3 id="qr-title" class="text-xl font-extrabold text-gray-900 mb-6 text-center w-full truncate px-2"></h3>
            
            <!-- QR Box with forced white background for scannability -->
            <div id="qrcode-container" class="bg-white p-5 rounded-2xl shadow-inner border border-gray-100 flex justify-center items-center w-64 h-64"></div>
            
            <p class="text-sm text-gray-500 mt-6 text-center font-medium bg-gray-100 py-2 px-4 rounded-full">카메라로 스캔하여 접속하세요</p>
            <button id="open-qr-link" class="mt-6 bg-brand-50 hover:bg-brand-100 text-brand-700 border border-brand-200 font-bold py-3 px-4 rounded-xl transition-colors w-full shadow-sm flex justify-center items-center">
                <i class="fa-solid fa-arrow-up-right-from-square mr-2"></i>새 창으로 열기
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 px-6 py-3.5 rounded-full shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center font-medium border border-gray-700 dark:border-gray-200">
        <i class="fa-solid fa-check-circle text-green-400 dark:text-green-600 mr-2 text-lg"></i>
        <span id="toast-message">복사되었습니다!</span>
    </div>

    <script>
        // --- App Configuration ---
        const SHEET_ID = '1HdIy5OLRkd3azdVKM_jIt6GSZrr3QkvoXFoHvain37s';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit?usp=sharing`;
        
        // State
        let adminPinCode = "";
        let categories = [];
        let activeCategory = "";
        let qrModalLink = "";

        // DOM Elements
        const DOM = {
            title: document.getElementById('dashboard-title'),
            tabsContainer: document.getElementById('tabs-container'),
            contentGrid: document.getElementById('content-grid'),
            loadingState: document.getElementById('loading-state'),
            emptyState: document.getElementById('empty-state'),
            
            themeToggle: document.getElementById('theme-toggle'),
            
            adminBtn: document.getElementById('admin-btn'),
            adminModal: document.getElementById('admin-modal'),
            closeAdminModal: document.getElementById('close-admin-modal'),
            adminPinInput: document.getElementById('admin-pin-input'),
            verifyAdminBtn: document.getElementById('verify-admin-btn'),
            adminError: document.getElementById('admin-error'),
            
            qrModal: document.getElementById('qr-modal'),
            closeQrModal: document.getElementById('close-qr-modal'),
            qrContainer: document.getElementById('qrcode-container'),
            qrTitle: document.getElementById('qr-title'),
            openQrLink: document.getElementById('open-qr-link'),
            
            toast: document.getElementById('toast'),
            toastMessage: document.getElementById('toast-message'),
        };

        // --- Initialization ---
        async function initApp() {
            initTheme();
            setupEventListeners();
            
            DOM.loadingState.classList.remove('hidden');
            DOM.loadingState.querySelector('p').innerText = "데이터 동기화 중...";

            // 병렬 처리: 설정과 카테고리 동시 로드 (E열 로고 확실하게 가져오기)
            const [settingsData, discoveredCategories] = await Promise.all([
                queryGViz('설정', 'SELECT A, B, C, D, E OFFSET 1'),
                discoverCategories()
            ]);
            
            if (settingsData && settingsData.length > 0) {
                const row = settingsData[0];
                adminPinCode = (row && row.c && row.c[0] && row.c[0].v) ? row.c[0].v.toString() : "0000";
                const dashboardTitle = (row && row.c && row.c[1] && row.c[1].v) ? row.c[1].v : "커리큘럼 대시보드";
                
                DOM.title.innerHTML = dashboardTitle;
                document.title = dashboardTitle;

                // 로고 처리 로직: 구글 드라이브 최신 우회 서버 적용
                const logoImg = document.getElementById('brand-logo');
                let logoUrl = "";
                
                // D열이 비어있어 배열이 밀리는 현상 방지를 위해 try-catch 적용
                try {
                    if (row && row.c && row.c[4] && row.c[4].v) {
                        logoUrl = row.c[4].v.toString().trim();
                    }
                } catch(e) {
                    console.log("로고 파싱 에러:", e);
                }
                
                if (logoUrl) {
                    // Drive URL에서 ID 추출
                    const match = logoUrl.match(/(?:id=|\/d\/)([a-zA-Z0-9_-]+)/);
                    
                    if (match && match[1]) {
                        const fileId = match[1];
                        // 1순위: 가장 안정적인 최신 lh3 이미지 서버 (엑스박스 방지)
                        logoImg.src = `https://lh3.googleusercontent.com/d/${fileId}`;
                        logoImg.classList.remove('hidden');
                        
                        // 2순위: lh3 실패 시 이전 방식으로 재시도
                        logoImg.onerror = function() {
                            if (this.src.includes('lh3.googleusercontent.com')) {
                                this.src = `https://drive.google.com/uc?export=view&id=${fileId}`;
                            } else {
                                this.classList.add('hidden'); // 둘 다 실패 시에만 숨김
                            }
                        };
                    } else {
                        // 일반 외부 이미지 링크일 경우 바로 적용
                        logoImg.src = logoUrl;
                        logoImg.classList.remove('hidden');
                    }
                }

            } else {
                DOM.title.innerHTML = "대시보드 로드 실패";
                showToast("설정 시트를 읽어오는데 실패했습니다.", true);
            }

            categories = discoveredCategories;
            
            if (categories.length === 0) {
                DOM.tabsContainer.innerHTML = `<span class="text-red-500 font-bold px-4 py-2 bg-red-50 rounded-lg">카테고리를 찾을 수 없습니다. 설정 시트 C열에 카테고리명을 입력해주세요.</span>`;
                DOM.loadingState.classList.add('hidden');
                return;
            }

            renderTabs();

            if (categories.length > 0) {
                await loadCategoryData(categories[0]);
            }
        }

        async function queryGViz(sheetName, query = 'SELECT A, B, C OFFSET 1') {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&tq=${encodeURIComponent(query)}`;
            try {
                // 매번 새로운 데이터를 가져오도록 캐시 무력화(cache: no-store) 설정
                const res = await fetch(url, { cache: "no-store" });
                const text = await res.text();
                
                const startIdx = text.indexOf('(');
                const endIdx = text.lastIndexOf(')');
                
                if (startIdx !== -1 && endIdx !== -1) {
                    const jsonString = text.substring(startIdx + 1, endIdx);
                    const data = JSON.parse(jsonString);
                    return data.table.rows;
                }
                return [];
            } catch (error) {
                console.error(`Error fetching sheet: ${sheetName}`, error);
                return null;
            }
        }

        async function discoverCategories() {
            // 설정 시트 C열에서 카테고리 바로 읽기
            const settingsData = await queryGViz('설정', 'SELECT C OFFSET 1');
            if (settingsData && settingsData.length > 0) {
                const fallbackCats = settingsData
                    .map(row => (row && row.c && row.c[0]) ? row.c[0].v : null)
                    .filter(val => val !== null && val !== undefined && val !== "");
                
                if (fallbackCats.length > 0) {
                    return fallbackCats;
                }
            }
            return ["카테고리 설정 필요"];
        }

        function renderTabs() {
            DOM.tabsContainer.innerHTML = '';
            categories.forEach(category => {
                const btn = document.createElement('button');
                btn.className = `px-6 py-3 rounded-xl text-[15px] font-bold transition-all duration-300 whitespace-nowrap shadow-sm border ${
                    activeCategory === category 
                    ? 'bg-brand-600 text-white border-brand-600 ring-2 ring-brand-200 dark:ring-brand-900 shadow-md transform -translate-y-0.5' 
                    : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600 hover:border-brand-400 hover:text-brand-600 hover:bg-brand-50 dark:hover:bg-gray-700'
                }`;
                btn.innerText = category;
                btn.onclick = () => loadCategoryData(category);
                DOM.tabsContainer.appendChild(btn);
            });
        }

        async function loadCategoryData(category) {
            activeCategory = category;
            renderTabs(); 
            
            DOM.contentGrid.innerHTML = '';
            DOM.emptyState.classList.add('hidden');
            DOM.loadingState.classList.remove('hidden');

            const rows = await queryGViz(category);
            
            DOM.loadingState.classList.add('hidden');

            if (!rows || rows.length === 0) {
                DOM.emptyState.classList.remove('hidden');
                return;
            }

            rows.forEach(row => {
                const title = (row && row.c && row.c[0]) ? row.c[0].v : '';
                const link1 = (row && row.c && row.c[1]) ? row.c[1].v : '';
                const link2 = (row && row.c && row.c[2]) ? row.c[2].v : '';

                if (!title) return;

                const card = document.createElement('div');
                // 카드 전체 디자인 개선 (흰색 배경, 그림자, 강제 상단 정렬 적용)
                card.className = 'bg-white dark:bg-gray-800 p-6 sm:p-7 rounded-2xl shadow-md border border-gray-200 dark:border-gray-700 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 relative overflow-hidden group flex flex-col justify-start';
                
                let contentHTML = `<div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-brand-400 to-brand-600 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300"></div>`;
                contentHTML += `<h3 class="text-xl sm:text-2xl font-extrabold text-gray-900 dark:text-white mb-6 line-clamp-2 leading-tight tracking-tight">${title}</h3>`;
                
                // 링크 영역을 위로 밀착시키기 위해 flex-grow나 mt-auto 속성을 전혀 사용하지 않음
                contentHTML += `<div class="space-y-4">`;
                contentHTML += createLinkUI(link1, "링크 1");
                contentHTML += createLinkUI(link2, "링크 2 (보조)");
                contentHTML += `</div>`;
                
                card.innerHTML = contentHTML;
                DOM.contentGrid.appendChild(card);
            });
        }

        function createLinkUI(content, label) {
            if (!content) return '';
            
            const contentStr = content.toString();
            const isUrl = contentStr.startsWith('http://') || contentStr.startsWith('https://');
            
            const escapeHTML = (str) => str.toString().replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])
            );
            
            const displayLabel = escapeHTML(label);
            const displayContent = escapeHTML(contentStr);
            const safeContent = encodeURIComponent(contentStr);
            const safeLabel = encodeURIComponent(label);
            
            if (isUrl) {
                return `
                    <div class="flex flex-col space-y-3 bg-gray-50 dark:bg-gray-700/50 p-4 rounded-xl border border-gray-200 dark:border-gray-600 transition-all hover:border-brand-300 hover:bg-white dark:hover:bg-gray-700 hover:shadow-sm">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold tracking-wider text-brand-600 dark:text-brand-400 uppercase flex items-center bg-brand-100 dark:bg-brand-900/40 px-2.5 py-1 rounded-md">
                                <i class="fa-solid fa-link mr-1.5"></i>${displayLabel}
                            </span>
                            <div class="flex space-x-2">
                                <button data-url="${safeContent}" data-label="${safeLabel}" onclick="handleQRClick(this)" class="p-2 text-gray-500 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 hover:text-brand-600 dark:hover:text-brand-400 hover:border-brand-300 rounded-lg shadow-sm transition-all" title="QR 코드 생성">
                                    <i class="fa-solid fa-qrcode"></i>
                                </button>
                                <a href="${displayContent}" target="_blank" class="p-2 text-gray-500 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 hover:text-brand-600 dark:hover:text-brand-400 hover:border-brand-300 rounded-lg shadow-sm transition-all" title="새 창 열기">
                                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                </a>
                            </div>
                        </div>
                        <div class="text-[14px] text-gray-600 dark:text-gray-300 truncate px-1 font-medium" title="${displayContent}">
                            <a href="${displayContent}" target="_blank" class="hover:underline hover:text-brand-600 transition-colors">
                                ${displayContent}
                            </a>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="flex flex-col space-y-3 bg-gray-50 dark:bg-gray-700/50 p-4 rounded-xl border border-gray-200 dark:border-gray-600 transition-all hover:border-brand-300 hover:bg-white dark:hover:bg-gray-700 hover:shadow-sm">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold tracking-wider text-brand-600 dark:text-brand-400 uppercase flex items-center bg-brand-100 dark:bg-brand-900/40 px-2.5 py-1 rounded-md">
                                <i class="fa-regular fa-file-lines mr-1.5"></i>${displayLabel}
                            </span>
                            <button data-content="${safeContent}" onclick="handleCopyClick(this)" class="px-3 py-1.5 flex items-center space-x-1.5 text-xs font-bold text-gray-600 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded-lg hover:border-brand-500 hover:text-brand-600 transition-all shadow-sm">
                                <i class="fa-regular fa-copy"></i>
                                <span>복사</span>
                            </button>
                        </div>
                        <div class="px-1 relative">
                            <div class="text-[14px] text-gray-700 dark:text-gray-200 line-clamp-2 leading-relaxed whitespace-pre-line break-words font-medium" title="${displayLabel} 내용">${displayContent}</div>
                            <button onclick="toggleTextExpansion(this)" class="text-xs text-brand-600 hover:text-brand-800 mt-2 font-bold inline-block transition-colors bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 px-3 py-1 rounded-md shadow-sm">
                                더보기 <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        window.handleQRClick = function(btn) {
            const url = decodeURIComponent(btn.getAttribute('data-url') || '');
            const label = decodeURIComponent(btn.getAttribute('data-label') || '');
            openQRModal(url, label);
        };

        window.handleCopyClick = function(btn) {
            const text = decodeURIComponent(btn.getAttribute('data-content') || '');
            copyToClipboard(text);
        };

        window.toggleTextExpansion = function(btn) {
            const textDiv = btn.previousElementSibling;
            if (textDiv.classList.contains('line-clamp-2')) {
                textDiv.classList.remove('line-clamp-2');
                btn.innerHTML = '접기 <i class="fa-solid fa-chevron-up text-[10px] ml-1"></i>';
                btn.classList.add('bg-brand-50');
            } else {
                textDiv.classList.add('line-clamp-2');
                btn.innerHTML = '더보기 <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>';
                btn.classList.remove('bg-brand-50');
            }
        };

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("텍스트가 복사되었습니다!");
            }).catch(err => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast("텍스트가 복사되었습니다!");
                } catch (err) {
                    showToast("복사 실패", true);
                }
                document.body.removeChild(textArea);
            });
        }

        let toastTimeout;
        function showToast(message, isError = false) {
            DOM.toastMessage.innerText = message;
            const icon = DOM.toast.querySelector('i');
            
            if (isError) {
                icon.className = "fa-solid fa-circle-exclamation text-red-400 mr-2 text-lg";
            } else {
                icon.className = "fa-solid fa-check-circle text-green-400 dark:text-green-500 mr-2 text-lg";
            }

            DOM.toast.classList.remove('opacity-0', 'translate-y-4');
            DOM.toast.classList.add('opacity-100', 'translate-y-0');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                DOM.toast.classList.remove('opacity-100', 'translate-y-0');
                DOM.toast.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }

        let currentQRCode = null;
        window.openQRModal = function(url, titleStr) {
            DOM.qrTitle.innerText = titleStr || "QR 코드";
            DOM.qrContainer.innerHTML = ''; 
            
            currentQRCode = new QRCode(DOM.qrContainer, {
                text: url,
                width: 220,
                height: 220,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
            
            qrModalLink = url;
            
            DOM.qrModal.classList.remove('hidden');
            DOM.qrModal.classList.add('flex');
            setTimeout(() => {
                DOM.qrModal.children[0].classList.add('modal-enter-active');
            }, 10);
        };

        function closeQRModal() {
            DOM.qrModal.children[0].classList.remove('modal-enter-active');
            setTimeout(() => {
                DOM.qrModal.classList.add('hidden');
                DOM.qrModal.classList.remove('flex');
            }, 300);
        }

        function openAdminModal() {
            DOM.adminError.classList.add('hidden');
            DOM.adminPinInput.value = '';
            DOM.adminModal.classList.remove('hidden');
            DOM.adminModal.classList.add('flex');
            setTimeout(() => {
                DOM.adminModal.children[0].classList.add('modal-enter-active');
                DOM.adminPinInput.focus();
            }, 10);
        }

        function closeAdminModal() {
            DOM.adminModal.children[0].classList.remove('modal-enter-active');
            setTimeout(() => {
                DOM.adminModal.classList.add('hidden');
                DOM.adminModal.classList.remove('flex');
            }, 300);
        }

        function verifyAdmin() {
            const input = DOM.adminPinInput.value;
            if (input === adminPinCode || adminPinCode === "0000") {
                closeAdminModal();
                window.open(SHEET_URL, '_blank');
            } else {
                DOM.adminError.classList.remove('hidden');
                DOM.adminModal.children[0].classList.add('animate-[pulse_0.2s_ease-in-out_2]');
                setTimeout(() => DOM.adminModal.children[0].classList.remove('animate-[pulse_0.2s_ease-in-out_2]'), 400);
            }
        }

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function setupEventListeners() {
            DOM.themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                if (document.documentElement.classList.contains('dark')) {
                    localStorage.theme = 'dark';
                } else {
                    localStorage.theme = 'light';
                }
            });

            DOM.adminBtn.addEventListener('click', openAdminModal);
            DOM.closeAdminModal.addEventListener('click', closeAdminModal);
            
            DOM.closeQrModal.addEventListener('click', closeQRModal);
            DOM.openQrLink.addEventListener('click', () => {
                if(qrModalLink) window.open(qrModalLink, '_blank');
            });

            window.addEventListener('click', (e) => {
                if (e.target === DOM.adminModal) closeAdminModal();
                if (e.target === DOM.qrModal) closeQRModal();
            });

            DOM.verifyAdminBtn.addEventListener('click', verifyAdmin);
            DOM.adminPinInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') verifyAdmin();
            });
        }

        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
